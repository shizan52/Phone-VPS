<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Phone VPS{% endblock %}</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#050a18;
            --bg-secondary:#0a1128;
            --glass:rgba(15,23,42,.5);
            --glass-strong:rgba(15,23,42,.7);
            --glass-border:rgba(255,255,255,.07);
            --glass-border-hover:rgba(255,255,255,.12);
            --text:#e2e8f0;
            --text-secondary:#94a3b8;
            --text-muted:#64748b;
            --cyan:#06b6d4;
            --blue:#3b82f6;
            --purple:#a855f7;
            --green:#22c55e;
            --orange:#f59e0b;
            --red:#ef4444;
            --pink:#ec4899;
            --sidebar-w:240px;
        }
        body{
            font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            overflow-x:hidden;
        }

        /* ═══ Animated Background ═══ */
        .bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
        .bg-mesh .orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.2}
        .bg-mesh .orb:nth-child(1){width:600px;height:600px;background:var(--cyan);top:-20%;left:-5%;animation:drift1 25s ease-in-out infinite alternate}
        .bg-mesh .orb:nth-child(2){width:500px;height:500px;background:var(--purple);bottom:-15%;right:-5%;animation:drift2 30s ease-in-out infinite alternate}
        .bg-mesh .orb:nth-child(3){width:400px;height:400px;background:var(--blue);top:40%;left:40%;animation:drift3 20s ease-in-out infinite alternate}
        @keyframes drift1{0%{transform:translate(0,0)}100%{transform:translate(60px,-40px)}}
        @keyframes drift2{0%{transform:translate(0,0)}100%{transform:translate(-40px,30px)}}
        @keyframes drift3{0%{transform:translate(0,0)}100%{transform:translate(-30px,-50px)}}

        /* ═══ Sidebar ═══ */
        .sidebar{
            position:fixed;left:0;top:0;
            width:var(--sidebar-w);height:100vh;
            background:var(--glass-strong);
            backdrop-filter:blur(30px) saturate(1.3);
            -webkit-backdrop-filter:blur(30px) saturate(1.3);
            border-right:1px solid var(--glass-border);
            padding:0;z-index:100;
            transition:transform .3s cubic-bezier(.4,0,.2,1);
            display:flex;flex-direction:column;
        }
        .sidebar::after{
            content:'';position:absolute;top:0;right:0;width:1px;height:100%;
            background:linear-gradient(180deg,var(--cyan),transparent 30%,transparent 70%,var(--purple));
            opacity:.4;
        }

        .sidebar-brand{
            padding:24px 20px 20px;
            border-bottom:1px solid var(--glass-border);
        }
        .sidebar-brand h2{
            font-size:17px;font-weight:700;
            background:linear-gradient(135deg,var(--cyan),var(--purple));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            display:flex;align-items:center;gap:8px;
        }
        .sidebar-brand small{color:var(--text-muted);font-size:11px;margin-top:2px;display:block}

        .nav-section{flex:1;padding:12px 0;overflow-y:auto}
        .nav-item{
            display:flex;align-items:center;gap:12px;
            padding:12px 20px;margin:2px 8px;
            color:var(--text-secondary);text-decoration:none;
            font-size:13.5px;font-weight:500;
            border-radius:10px;
            transition:all .2s;
            position:relative;
        }
        .nav-item:hover{
            background:rgba(255,255,255,.05);
            color:var(--text);
        }
        .nav-item.active{
            background:linear-gradient(135deg,rgba(6,182,212,.12),rgba(168,85,247,.08));
            color:var(--text);
            box-shadow:0 0 20px rgba(6,182,212,.08);
        }
        .nav-item.active::before{
            content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;
            background:linear-gradient(180deg,var(--cyan),var(--purple));
            border-radius:0 3px 3px 0;
        }
        .nav-icon{font-size:18px;width:22px;text-align:center;flex-shrink:0}

        .sidebar-footer{
            padding:12px 8px;
            border-top:1px solid var(--glass-border);
        }
        .nav-item.logout{color:var(--red);border:none}
        .nav-item.logout:hover{background:rgba(239,68,68,.1)}

        /* ═══ Hamburger (mobile) ═══ */
        .hamburger{
            display:none;position:fixed;top:14px;left:14px;z-index:200;
            background:var(--glass-strong);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border:1px solid var(--glass-border);
            color:var(--text);width:42px;height:42px;
            border-radius:10px;font-size:18px;
            cursor:pointer;
            align-items:center;justify-content:center;
            -webkit-tap-highlight-color:transparent;
            transition:background .2s;
        }
        .hamburger:hover{background:rgba(255,255,255,.08)}
        .sidebar-overlay{
            display:none;position:fixed;inset:0;
            background:rgba(0,0,0,.6);
            backdrop-filter:blur(4px);
            z-index:99;
        }
        .sidebar-overlay.show{display:block}

        /* ═══ Main Content ═══ */
        .main{
            margin-left:var(--sidebar-w);
            padding:28px;
            min-height:100vh;
            position:relative;z-index:1;
        }

        @media(max-width:768px){
            .hamburger{display:flex}
            .sidebar{transform:translateX(-100%)}
            .sidebar.open{transform:translateX(0);box-shadow:4px 0 30px rgba(0,0,0,.5)}
            .main{margin-left:0;padding:64px 16px 24px}
            .page-header{flex-wrap:wrap;gap:10px}
            .page-header h1{font-size:18px}
            .btn-row{flex-wrap:wrap}
            .btn{padding:9px 14px;font-size:12px}
            .modal{min-width:unset;width:calc(100vw - 32px);max-width:360px}
        }

        /* ═══ Page Header ═══ */
        .page-header{
            display:flex;justify-content:space-between;align-items:center;
            margin-bottom:28px;
        }
        .page-header h1{
            font-size:24px;font-weight:700;
            display:flex;align-items:center;gap:10px;
        }

        /* ═══ Status Badge ═══ */
        .status-badge{
            display:inline-flex;align-items:center;gap:7px;
            padding:7px 18px;border-radius:20px;
            font-size:12px;font-weight:600;letter-spacing:.5px;
            backdrop-filter:blur(10px);
        }
        .status-badge.online{
            background:rgba(34,197,94,.1);
            color:var(--green);
            border:1px solid rgba(34,197,94,.2);
            box-shadow:0 0 15px rgba(34,197,94,.08);
        }
        .status-badge.offline{
            background:rgba(239,68,68,.1);
            color:var(--red);
            border:1px solid rgba(239,68,68,.2);
        }
        .status-dot{
            width:8px;height:8px;border-radius:50%;
            background:currentColor;
            box-shadow:0 0 8px currentColor;
            animation:pulse 2s infinite;
        }
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

        /* ═══ Glass Cards ═══ */
        .card-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
            gap:16px;margin-bottom:28px;
        }
        .card{
            background:var(--glass);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border:1px solid var(--glass-border);
            border-radius:16px;
            padding:22px 18px;
            text-align:center;
            transition:all .3s cubic-bezier(.4,0,.2,1);
            position:relative;overflow:hidden;
        }
        .card::before{
            content:'';position:absolute;inset:0;
            background:linear-gradient(135deg,rgba(6,182,212,.05),transparent 50%);
            opacity:0;transition:opacity .3s;
        }
        .card:hover{
            border-color:var(--glass-border-hover);
            transform:translateY(-4px);
            box-shadow:0 12px 30px rgba(0,0,0,.3),0 0 20px rgba(6,182,212,.05);
        }
        .card:hover::before{opacity:1}
        .card-icon{font-size:28px;margin-bottom:10px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.3))}
        .card-label{
            font-size:10px;text-transform:uppercase;letter-spacing:1.2px;
            color:var(--text-muted);margin-bottom:6px;font-weight:600;
        }
        .card-value{font-size:16px;font-weight:700;word-break:break-all;position:relative;z-index:1}

        /* ═══ Glass Panel Box ═══ */
        .panel-box{
            background:var(--glass);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            border:1px solid var(--glass-border);
            border-radius:16px;
            padding:22px;
            margin-bottom:20px;
            transition:border-color .2s;
        }
        .panel-box:hover{border-color:var(--glass-border-hover)}
        .panel-box-title{
            font-size:13px;font-weight:600;
            margin-bottom:16px;
            color:var(--text-muted);
            text-transform:uppercase;
            letter-spacing:.8px;
            display:flex;align-items:center;gap:8px;
        }

        /* ═══ Credentials ═══ */
        .cred-grid{
            display:grid;grid-template-columns:1fr 1fr;
            gap:16px;margin-bottom:20px;
        }
        .cred-box{
            background:rgba(15,23,42,.6);
            border:1px solid var(--glass-border);
            border-radius:12px;
            padding:16px;
            display:flex;justify-content:space-between;align-items:center;
            transition:border-color .2s;
        }
        .cred-box:hover{border-color:rgba(6,182,212,.2)}
        .cred-label{
            font-size:10px;text-transform:uppercase;
            color:var(--text-muted);letter-spacing:.5px;font-weight:600;
        }
        .cred-value{
            font-size:15px;font-weight:600;color:var(--orange);margin-top:4px;
        }
        .copy-btn{
            background:rgba(255,255,255,.05);border:1px solid var(--glass-border);
            color:var(--text-secondary);padding:7px 9px;border-radius:8px;
            cursor:pointer;font-size:14px;transition:all .2s;
        }
        .copy-btn:hover{background:rgba(6,182,212,.15);color:var(--cyan);border-color:rgba(6,182,212,.3)}

        /* ═══ Buttons ═══ */
        .btn-row{display:flex;gap:10px;flex-wrap:wrap}
        .btn{
            display:inline-flex;align-items:center;gap:7px;
            padding:10px 22px;border:none;border-radius:10px;
            font-size:13px;font-weight:600;cursor:pointer;
            transition:all .25s cubic-bezier(.4,0,.2,1);
            color:white;position:relative;overflow:hidden;
        }
        .btn::after{
            content:'';position:absolute;inset:0;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);
            transform:translateX(-100%);transition:transform .4s;
        }
        .btn:hover::after{transform:translateX(100%)}
        .btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
        .btn:active{transform:translateY(0) scale(.97)}

        .btn-green{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 4px 15px rgba(34,197,94,.2)}
        .btn-red{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 15px rgba(239,68,68,.2)}
        .btn-orange{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 4px 15px rgba(245,158,11,.2)}
        .btn-blue{background:linear-gradient(135deg,#3b82f6,#2563eb);box-shadow:0 4px 15px rgba(59,130,246,.2)}
        .btn-purple{background:linear-gradient(135deg,#a855f7,#9333ea);box-shadow:0 4px 15px rgba(168,85,247,.2)}
        .btn-cyan{background:linear-gradient(135deg,#06b6d4,#0891b2);box-shadow:0 4px 15px rgba(6,182,212,.2)}

        /* ═══ Progress Bars ═══ */
        .progress-bar-wrap{
            background:rgba(15,23,42,.6);
            border-radius:8px;height:10px;overflow:hidden;margin-top:10px;
            border:1px solid var(--glass-border);
        }
        .progress-bar-fill{
            height:100%;border-radius:8px;
            transition:width .6s cubic-bezier(.4,0,.2,1);
            position:relative;
        }
        .progress-bar-fill::after{
            content:'';position:absolute;inset:0;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
            animation:shimmer 2s infinite;
        }
        @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
        .progress-label{
            display:flex;justify-content:space-between;
            font-size:12px;color:var(--text-muted);margin-top:6px;
        }

        /* ═══ Service Rows ═══ */
        .service-row{
            display:flex;justify-content:space-between;align-items:center;
            padding:14px 0;border-bottom:1px solid var(--glass-border);
            transition:background .15s;
        }
        .service-row:last-child{border-bottom:none}
        .service-row:hover{background:rgba(255,255,255,.02);margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:8px}
        .service-name{font-weight:600;font-size:14px}
        .service-port{color:var(--text-muted);font-size:12px;margin-top:2px}
        .service-status{display:flex;align-items:center;gap:10px}
        .service-badge{
            padding:4px 12px;border-radius:6px;
            font-size:11px;font-weight:700;letter-spacing:.3px;
        }
        .service-badge.running{
            background:rgba(34,197,94,.12);color:var(--green);
            box-shadow:0 0 10px rgba(34,197,94,.08);
        }
        .service-badge.stopped{
            background:rgba(239,68,68,.12);color:var(--red);
        }
        .service-btn{
            padding:5px 12px;
            border:1px solid var(--glass-border);
            background:rgba(255,255,255,.04);
            color:var(--text-secondary);
            border-radius:6px;cursor:pointer;font-size:11px;
            transition:all .2s;
        }
        .service-btn:hover{background:rgba(255,255,255,.08);color:var(--text)}

        /* ═══ Toast ═══ */
        .toast{
            position:fixed;top:20px;right:20px;
            background:var(--glass-strong);
            backdrop-filter:blur(20px);
            border:1px solid var(--green);
            color:var(--text);padding:14px 22px;
            border-radius:12px;font-size:13px;z-index:9999;
            opacity:0;transform:translateY(-10px);
            transition:all .35s cubic-bezier(.4,0,.2,1);
            box-shadow:0 8px 30px rgba(0,0,0,.4);
        }
        .toast.show{opacity:1;transform:translateY(0)}
        .toast.error{border-color:var(--red)}

        /* ═══ Footer status ═══ */
        .footer-status{
            text-align:center;color:var(--green);
            font-size:12px;padding:12px;
            opacity:.7;
        }

        /* ═══ File Table ═══ */
        .file-table{width:100%;border-collapse:collapse}
        .file-table th{
            text-align:left;padding:10px 12px;
            font-size:10px;text-transform:uppercase;letter-spacing:.8px;
            color:var(--text-muted);border-bottom:1px solid var(--glass-border);
        }
        .file-table td{padding:10px 12px;border-bottom:1px solid var(--glass-border);font-size:13px}
        .file-table tr:hover{background:rgba(255,255,255,.03)}
        .file-icon{font-size:18px;margin-right:8px}
        .file-name-link{color:var(--text);text-decoration:none;transition:color .2s}
        .file-name-link:hover{color:var(--cyan)}
        .file-actions{display:flex;gap:6px}
        .file-action-btn{
            padding:4px 8px;border:1px solid var(--glass-border);
            background:none;color:var(--text-secondary);
            border-radius:6px;cursor:pointer;font-size:12px;
            transition:all .2s;
        }
        .file-action-btn:hover{background:rgba(255,255,255,.05);color:var(--text)}
        .file-action-btn.delete:hover{color:var(--red);border-color:rgba(239,68,68,.3)}

        .breadcrumb{
            display:flex;align-items:center;gap:6px;
            margin-bottom:16px;font-size:13px;color:var(--text-muted);
        }
        .breadcrumb a{color:var(--cyan);text-decoration:none;transition:opacity .2s}
        .breadcrumb a:hover{opacity:.8}

        .upload-area{
            border:2px dashed var(--glass-border);
            border-radius:14px;padding:30px;
            text-align:center;color:var(--text-muted);
            margin-bottom:16px;cursor:pointer;
            transition:all .25s;
        }
        .upload-area:hover,.upload-area.dragover{
            border-color:var(--cyan);
            background:rgba(6,182,212,.04);
        }
        .upload-area input[type="file"]{display:none}

        /* ═══ Modal ═══ */
        .modal-overlay{
            display:none;position:fixed;inset:0;
            background:rgba(0,0,0,.6);
            backdrop-filter:blur(4px);
            z-index:1000;
            justify-content:center;align-items:center;
        }
        .modal-overlay.show{display:flex}
        .modal{
            background:var(--glass-strong);
            backdrop-filter:blur(30px);
            border:1px solid var(--glass-border);
            border-radius:16px;padding:24px;min-width:360px;
            box-shadow:0 20px 50px rgba(0,0,0,.5);
        }
        .modal h3{margin-bottom:16px;font-size:16px}
        .modal input[type="text"],.modal input[type="password"]{
            width:100%;padding:10px 14px;
            background:rgba(15,23,42,.6);
            border:1px solid var(--glass-border);
            border-radius:8px;color:var(--text);
            font-size:14px;margin-bottom:16px;outline:none;
            transition:border-color .2s;
        }
        .modal input:focus{border-color:rgba(6,182,212,.4)}
        .modal-btns{display:flex;gap:10px;justify-content:flex-end}

        /* ═══ Two Cols ═══ */
        .two-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
        @media(max-width:1000px){
            .two-cols{grid-template-columns:1fr}
            .cred-grid{grid-template-columns:1fr}
            .card-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}
        }
        @media(max-width:768px){
            .two-cols{gap:12px}
            .card-grid{grid-template-columns:repeat(2,1fr);gap:10px}
            .card{padding:16px 12px}
            .card-value{font-size:14px}
            .card-icon{font-size:22px;margin-bottom:6px}
            .panel-box{padding:16px;margin-bottom:14px;border-radius:14px}
            .cred-box{padding:12px}
            .cred-value{font-size:13px}
            .service-row{flex-wrap:wrap;gap:8px}
            .upload-area{padding:20px}
            .toast{top:auto;bottom:16px;left:16px;right:16px}
            .breadcrumb{flex-wrap:wrap;font-size:12px}
        }
        @media(max-width:400px){
            .card-grid{grid-template-columns:repeat(2,1fr);gap:8px}
            .card{padding:12px 8px}
            .card-label{font-size:9px}
            .card-value{font-size:12px}
        }

        /* ═══ Entrance animation ═══ */
        .main{animation:mainIn .5s cubic-bezier(.16,1,.3,1) both}
        @keyframes mainIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    </style>
</head>
<body>
    <!-- Background -->
    <div class="bg-mesh">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- Hamburger (mobile) -->
    <button class="hamburger" id="menuBtn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <h2>Phone VPS</h2>
            <small>control panel</small>
        </div>
        <div class="nav-section">
            <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}" onclick="closeSidebar()">
                <span class="nav-icon">📊</span> Dashboard
            </a>
            <a href="/files" class="nav-item {% if '/files' in request.path %}active{% endif %}" onclick="closeSidebar()">
                <span class="nav-icon">📁</span> File Manager
            </a>
            <a href="/websites" class="nav-item {% if '/websites' in request.path %}active{% endif %}" onclick="closeSidebar()">
                <span class="nav-icon">🌐</span> Website Space
            </a>
            <a href="/remote" class="nav-item {% if '/remote' in request.path %}active{% endif %}" onclick="closeSidebar()">
                <span class="nav-icon">🔗</span> Remote Access
            </a>
            <a href="/trash" class="nav-item {% if '/trash' in request.path %}active{% endif %}" onclick="closeSidebar()">
                <span class="nav-icon">🗑️</span> Recycle Bin
            </a>
        </div>
        <div class="sidebar-footer">
            <a href="/logout" class="nav-item logout" onclick="closeSidebar()">
                <span class="nav-icon">🚪</span> Logout
            </a>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Main -->
    <div class="main">
        {% block content %}{% endblock %}
    </div>

    <script>
        function toggleSidebar(){
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }
        function closeSidebar(){
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('show');
        }
        function showToast(msg,isError=false){
            const t=document.getElementById('toast');
            t.textContent=msg;
            t.className='toast show'+(isError?' error':'');
            setTimeout(()=>t.className='toast',3000);
        }
        function copyText(text){
            navigator.clipboard.writeText(text).then(()=>showToast('Copied!'));
        }
        async function apiPost(url,body={}){
            try{
                const res=await fetch(url,{
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(body)
                });
                const data=await res.json();
                if(data.ok)showToast(data.msg||'Success');
                else showToast(data.msg||data.error||'Failed',true);
                return data;
            }catch(err){
                showToast('Request failed: '+err.message,true);
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
