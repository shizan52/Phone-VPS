<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Phone VPS</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#050a18;
            --glass:rgba(15,23,42,.55);
            --glass-border:rgba(255,255,255,.08);
            --text:#e2e8f0;
            --muted:#64748b;
            --cyan:#06b6d4;
            --purple:#a855f7;
            --red:#ef4444;
        }
        body{
            font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100dvh;
            display:flex;align-items:center;justify-content:center;
            padding:16px;
            overflow:hidden;
        }

        /* ── Animated mesh background ── */
        .bg-mesh{position:fixed;inset:0;z-index:0;overflow:hidden}
        .bg-mesh .orb{
            position:absolute;border-radius:50%;
            filter:blur(80px);opacity:.35;
            animation:orbFloat 20s ease-in-out infinite alternate;
        }
        .bg-mesh .orb:nth-child(1){width:500px;height:500px;background:#06b6d4;top:-15%;left:-10%;animation-delay:0s}
        .bg-mesh .orb:nth-child(2){width:400px;height:400px;background:#a855f7;bottom:-10%;right:-10%;animation-delay:-7s}
        .bg-mesh .orb:nth-child(3){width:300px;height:300px;background:#3b82f6;top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-14s}
        @keyframes orbFloat{
            0%{transform:translate(0,0) scale(1)}
            33%{transform:translate(30px,-40px) scale(1.1)}
            66%{transform:translate(-20px,30px) scale(.95)}
            100%{transform:translate(10px,-10px) scale(1.05)}
        }

        /* ── Grid pattern overlay ── */
        .bg-grid{
            position:fixed;inset:0;z-index:1;
            background-image:
                linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
                linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
            background-size:60px 60px;
            mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,black 40%,transparent 100%);
            -webkit-mask-image:radial-gradient(ellipse 60% 60% at 50% 50%,black 40%,transparent 100%);
        }

        /* ── Login card ── */
        .login-card{
            position:relative;z-index:10;
            background:var(--glass);
            backdrop-filter:blur(40px) saturate(1.3);
            -webkit-backdrop-filter:blur(40px) saturate(1.3);
            border:1px solid var(--glass-border);
            border-radius:24px;
            padding:44px 32px 36px;
            width:100%;max-width:400px;
            text-align:center;
            box-shadow:
                0 25px 50px rgba(0,0,0,.4),
                0 0 0 1px rgba(255,255,255,.05) inset,
                0 1px 0 rgba(255,255,255,.1) inset;
            animation:cardIn .8s cubic-bezier(.16,1,.3,1) both;
        }
        @keyframes cardIn{
            from{opacity:0;transform:translateY(30px) scale(.96)}
            to{opacity:1;transform:translateY(0) scale(1)}
        }

        /* ── Glow line at top of card ── */
        .login-card::before{
            content:'';position:absolute;top:-1px;left:20%;right:20%;height:2px;
            background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);
            border-radius:2px;
        }

        /* ── 3D Profile ── */
        .profile-wrap{
            perspective:800px;
            display:flex;justify-content:center;
            margin-bottom:28px;
        }
        .profile-3d{
            width:110px;height:110px;
            border-radius:50%;
            position:relative;
            transform-style:preserve-3d;
            animation:float3d 6s ease-in-out infinite;
        }
        .profile-3d img{
            width:100%;height:100%;
            border-radius:50%;object-fit:cover;display:block;
            border:3px solid transparent;
            background-clip:padding-box;
            box-shadow:
                0 0 0 3px rgba(6,182,212,.4),
                0 8px 32px rgba(6,182,212,.2),
                0 4px 16px rgba(0,0,0,.5);
        }
        .profile-3d::before{
            content:'';position:absolute;inset:-8px;border-radius:50%;
            background:conic-gradient(from 0deg,transparent 0%,var(--cyan) 25%,transparent 50%,var(--purple) 75%,transparent 100%);
            animation:ring-spin 4s linear infinite;z-index:-1;
            opacity:.7;
        }
        .profile-3d::after{
            content:'';position:absolute;
            bottom:-14px;left:15%;width:70%;height:16px;
            border-radius:50%;
            background:rgba(6,182,212,.12);
            filter:blur(8px);
            animation:shadow-pulse 6s ease-in-out infinite;
        }
        @keyframes float3d{
            0%,100%{transform:rotateY(-8deg) rotateX(5deg) translateY(0)}
            50%{transform:rotateY(8deg) rotateX(-5deg) translateY(-10px)}
        }
        @keyframes ring-spin{to{transform:rotate(360deg)}}
        @keyframes shadow-pulse{
            0%,100%{opacity:.5;transform:scale(1)}
            50%{opacity:.9;transform:scale(1.12)}
        }

        .login-title{
            font-size:20px;font-weight:700;
            margin-bottom:4px;
            background:linear-gradient(135deg,#e2e8f0,#94a3b8);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        }
        .login-sub{font-size:13px;color:var(--muted);margin-bottom:24px}

        /* ── Input ── */
        .input-group{position:relative;margin-bottom:16px}
        .input-group input{
            width:100%;padding:14px 46px 14px 16px;
            background:rgba(15,23,42,.6);
            border:1px solid rgba(255,255,255,.08);
            border-radius:12px;
            color:var(--text);font-size:15px;
            outline:none;
            transition:border-color .25s,box-shadow .25s;
            -webkit-appearance:none;
        }
        .input-group input::placeholder{color:var(--muted)}
        .input-group input:focus{
            border-color:rgba(6,182,212,.5);
            box-shadow:0 0 0 3px rgba(6,182,212,.1),0 0 20px rgba(6,182,212,.08);
        }
        .toggle-pw{
            position:absolute;right:14px;top:50%;transform:translateY(-50%);
            background:none;border:none;color:var(--muted);cursor:pointer;
            font-size:18px;padding:0;width:auto;
            transition:color .2s;
        }
        .toggle-pw:hover{color:var(--text)}

        /* ── Button ── */
        .login-btn{
            width:100%;padding:14px;
            background:linear-gradient(135deg,var(--cyan),#0891b2,var(--purple));
            background-size:200% 200%;
            animation:btnGrad 4s ease infinite;
            border:none;border-radius:12px;
            color:#fff;font-size:15px;font-weight:600;
            cursor:pointer;
            transition:transform .15s,box-shadow .25s;
            letter-spacing:.3px;
            position:relative;overflow:hidden;
        }
        .login-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 25px rgba(6,182,212,.3);
        }
        .login-btn:active{transform:translateY(0) scale(.98)}
        .login-btn::after{
            content:'';position:absolute;inset:0;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
            transform:translateX(-100%);
            transition:transform .5s;
        }
        .login-btn:hover::after{transform:translateX(100%)}
        @keyframes btnGrad{
            0%,100%{background-position:0% 50%}
            50%{background-position:100% 50%}
        }

        /* ── Error ── */
        .error-msg{
            color:var(--red);font-size:13px;
            margin-bottom:14px;
            background:rgba(239,68,68,.08);
            border:1px solid rgba(239,68,68,.15);
            padding:10px 14px;border-radius:10px;
            animation:shake .4s ease;
        }
        @keyframes shake{
            0%,100%{transform:translateX(0)}
            20%,60%{transform:translateX(-6px)}
            40%,80%{transform:translateX(6px)}
        }

        /* ── Footer ── */
        .login-footer{
            margin-top:20px;font-size:11px;color:var(--muted);
            display:flex;align-items:center;justify-content:center;gap:6px;
        }
        .login-footer .dot{
            width:6px;height:6px;border-radius:50%;
            background:var(--cyan);
            animation:pulse 2s infinite;
        }
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

        @media(max-width:420px){
            .login-card{padding:32px 22px 28px;border-radius:20px}
            .profile-3d{width:90px;height:90px}
        }
        @media(max-height:500px){
            body{align-items:flex-start;padding-top:20px}
            .profile-3d{width:70px;height:70px}
            .profile-wrap{margin-bottom:16px}
        }
    </style>
</head>
<body>
    <div class="bg-mesh">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>
    <div class="bg-grid"></div>

    <div class="login-card">
        <div class="profile-wrap">
            <div class="profile-3d">
                <img src="/asset/profile.png" alt="Profile">
            </div>
        </div>
        <div class="login-title">Phone VPS</div>
        <div class="login-sub">Control panel &middot; sign in</div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="input-group">
                <input type="password" name="password" id="pw" placeholder="Enter password" autofocus required>
                <button type="button" class="toggle-pw" onclick="togglePassword()" tabindex="-1">👁</button>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="login-footer">
            <span class="dot"></span> Encrypted Connection
        </div>
    </div>

    <script>
    function togglePassword(){
        const i=document.getElementById('pw');
        i.type=i.type==='password'?'text':'password';
    }
    </script>
</body>
</html>
